name: Archive GitHub traffic

on:
  schedule:
    # Daily at 01:17 UTC (09:17 in Taiwan/Macau).
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-github-traffic
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect traffic statistics
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 scripts/collect_github_traffic.py

      - name: Commit updated traffic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-traffic.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive GitHub traffic"
            git push
          fi
