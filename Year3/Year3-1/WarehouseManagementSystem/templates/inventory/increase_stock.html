{% extends "base.html" %}


{% block content %}


<h1>
增加库存
</h1>


<h3>
{{item.name}}
</h3>


<form method="post"
      enctype="multipart/form-data">


{% csrf_token %}



增加数量:

<input
type="number"
name="quantity"
min="0"
required
>

{% if item.is_serialized %}
<br><br>

<p>该物品为单件设备，请为每件设备手动输入编码：</p>

<div id="serial-container"></div>
{% endif %}


<br><br>

<p>本次增加库存不会修改已有物品的购买日期、有效期和失效日期。</p>

<br>


原因:

<select name="reason">


<option value="PURCHASE">
采购入库
</option>


<option value="RETURN">
归还入库
</option>


<option value="TRANSFER_IN">
调拨入库
</option>


</select>


<br><br>


位置照片:

<input
type="file"
name="location_image"
>


<br><br>


<button type="submit">

确认增加

</button>


</form>

{% if item.is_serialized %}
<script>
const quantityInput = document.querySelector('input[name="quantity"]');
const serialContainer = document.getElementById("serial-container");

function generateSerialInputs() {
    serialContainer.innerHTML = "";
    const quantity = parseInt(quantityInput.value) || 0;
    for (let i = 1; i <= quantity; i++) {
        const row = document.createElement("div");
        row.innerHTML = `
            <label>设备编码 ${i}:</label>
            <input type="text" name="serial_numbers" required>
            <br><br>
        `;
        serialContainer.appendChild(row);
    }
}

quantityInput.addEventListener("input", generateSerialInputs);
generateSerialInputs();
</script>
{% endif %}


{% endblock %}
