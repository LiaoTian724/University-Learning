{% extends "base.html" %} 
 
 
{% block content %} 
 
 
<h1> 
库存列表 
</h1> 
 
 
<table border="1"> 
 
 
 
<tr> 
 
<th> 
名称 
</th> 
 
<th> 
类别 
</th> 
 
<th> 
数量 
</th> 
 
<th> 
位置 
</th> 
 
<th> 
状态 
</th> 
 
<th> 
操作 
</th> 
 
 
</tr> 
 
 
 
 
{% for item in items %} 
 
 
<tr> 
 
<td> 
{{ item.name }} 
</td> 
 
 
<td> 
{{ item.category }} 
</td> 
 
 
<td> 
{{ item.quantity }} 
</td> 
 
 
<td> 
{{item.location}} 
</td> 
 
 
<td> 
{{item.status}} 
</td> 
 
 
<td> 
 
<a href="{% url 'item_detail' item.id %}"> 
查看 
</a> 
 
 
</td> 
 
</tr> 
 
 
{% empty %} 
 
 
<tr> 
 
<td colspan="6"> 
 
暂无库存 
 
</td> 
 
 
</tr> 
 
 
{% endfor %} 
 
 
 
</table> 
 
 
{% endblock %}
