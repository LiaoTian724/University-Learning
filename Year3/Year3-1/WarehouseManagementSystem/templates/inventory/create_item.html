{% extends "base.html" %}


{% block content %}


<h1>
新增物品
</h1>


<form method="post"
      enctype="multipart/form-data">

{% csrf_token %}


<label>
物品名称:
</label>

<input 
type="text"
name="name"
>


<br><br>


<label>
类别:
</label>

<input 
type="text"
name="category"
>


<br><br>


<label>
数量:
</label>

<input
type="number"
name="quantity"
>


<br><br>


<label>
位置:
</label>

<input
type="text"
name="location"
>

<br><br>


<label>
位置照片:
</label>


<input
type="file"
name="location_image">


<hr>


<h3>
自定义属性
</h3>


<div id="attributes">


<div>

<input
type="text"
name="attribute_key"
placeholder="属性名，例如品牌"
>


<input
type="text"
name="attribute_value"
placeholder="属性值，例如戴尔"
>


</div>


</div>


<br>


<button 
type="button"
onclick="addAttribute()">

+ 添加属性

</button>


<br><br>


<button type="submit">

保存

</button>


</form>



<script>

function addAttribute(){

    let div = document.createElement("div");


    div.innerHTML = `

    <br>

    <input
    type="text"
    name="attribute_key"
    placeholder="属性名">


    <input
    type="text"
    name="attribute_value"
    placeholder="属性值">

    `;


    document
    .getElementById("attributes")
    .appendChild(div);

}


</script>


{% endblock %}
