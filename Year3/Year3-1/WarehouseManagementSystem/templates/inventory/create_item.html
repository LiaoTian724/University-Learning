{% extends "base.html" %}


{% block content %}


<h1>
    新增物品
</h1>


<form method="post" enctype="multipart/form-data">

    {% csrf_token %}


    <label>
        物品名称:
    </label>

    <input list="item_list" type="text" name="name" value="{{name}}" required>


    <datalist id="item_list">

        {% for item_name in item_names %}

        <option value="{{item_name}}">

            {% endfor %}

    </datalist>


    <br><br>


    <label>
        类别:
    </label>

    <input list="category_list" type="text" name="category" value="{{category}}" required>


    <datalist id="category_list">


        {% for c in categories %}

        <option value="{{c}}">

            {% endfor %}


    </datalist>



    {% if warning %}


    <input type="hidden" name="item_id" value="{{same_item.id}}">


    <button type="submit" name="add_existing" value="1">

        增加已有库存

    </button>


    <button type="submit" name="force_create" value="1">

        仍然创建新物品

    </button>


    {% endif %}



    <br><br>



   


    <label>
        库存类型:
    </label>


    <select name="is_serialized" id="inventory_type">

        <option value="0">
            普通库存
        </option>


        <option value="1">
            单件设备管理
        </option>

    </select>


    <br><br>

    <label>
        数量:
    </label>

    <input type="number" name="quantity" value="{{quantity}}" min="1" required>


    <br><br>
    <div id="serial-container">

    </div>


    <label>
        位置:
    </label>

    <input type="text" name="location" value="{{location}}">

    <br><br>


    <label>
        位置照片:
    </label>

    <input type="file" name="location_image">


    <br><br>




    <label>
        购买时间:
    </label>

    <input type="date" name="purchase_date" value="{{purchase_date}}">


    <br><br>


    <label>
        有效期(月):
    </label>


    <input type="number" name="valid_period" value="{{valid_period}}" min="1">


    <br><br>


    <label>
        失效时间:
    </label>


    <input type="date" name="expiry_date" value="{{expiry_date}}">


    <br><br>


    <label>
        附件:
    </label>
    <input type="file" name="location_image">


    <hr>


    <h3>
        自定义属性
    </h3>


    <div id="attributes">


        <div>

            <input type="text" name="attribute_key" placeholder="属性名，例如品牌">


            <input type="text" name="attribute_value" placeholder="属性值，例如戴尔">


        </div>


    </div>


    <br>


    <button type="button" onclick="addAttribute()">

        + 添加属性

    </button>


    <br><br>


    <button type="submit">

        保存

    </button>


</form>



<script>

    function addAttribute() {

        let div = document.createElement("div");

        div.innerHTML = `

    <br>

    <input 
    type="text"
    name="attribute_key"
    placeholder="属性名">

    <input
    type="text"
    name="attribute_value"
    placeholder="属性值">

    `;


        document
            .getElementById("attributes")
            .appendChild(div);

    }



    const quantityInput =
        document.querySelector(
            'input[name="quantity"]'
        );


    const container =
        document.getElementById(
            "serial-container"
        );



    const typeSelect =
        document.getElementById(
            "inventory_type"
        );



    function generateSerialInputs() {


        container.innerHTML = "";


        if (typeSelect.value == "0") {
            return;
        }


        let quantity = parseInt(
            quantityInput.value
        );


        if (!quantity) {
            return;
        }


        for (let i = 1; i <= quantity; i++) {


            let div = document.createElement("div");


            div.innerHTML = `

        <label>
        设备编号 ${i}
        </label>

        <input
        type="text"
        name="serial_numbers"
        required>

        <br><br>

        `;


            container.appendChild(div);

        }

    }



    if (typeSelect) {

        typeSelect.addEventListener(
            "change",
            generateSerialInputs
        );

    }


    quantityInput.addEventListener(
        "input",
        generateSerialInputs
    );



</script>


{% endblock %}
