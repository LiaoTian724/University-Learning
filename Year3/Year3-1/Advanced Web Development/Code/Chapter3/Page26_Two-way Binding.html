<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>v-model Example</title>
</head>

<body>

    <div id="app">
        <div>Name: </div>
        <input v-model="name">

        <p>Hello {{ name }}!</p>
    </div>

<script src="https://unpkg.com/vue@3"></script>

<script>
    const options = {
        data() {
            return {
                name: ""
            };
        }
    };

    Vue.createApp(options).mount("#app");
</script>

</body>

</html>
