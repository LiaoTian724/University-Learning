<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Event Listener Example</title>
</head>

<body>

    <button id="button">Click Me</button>

    <script>

        let btn = document.getElementById("button");
        btn.addEventListener("click", function() {
            console.log("Hello");
        })
    </script>

</body>

</html>
