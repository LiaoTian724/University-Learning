<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Vue Conditional Rendering</title>
</head>

<body>

    <div id="app">

        <div>
            Temperature: {{ temperature }} °C
        </div>

        <input v-model.number="temperature">

        <span v-if="temperature >= 25">
            It's hot!
        </span>

        <span v-else-if="temperature >= 10">
            Pleasant weather
        </span>

        <span v-else>
            It's cold, stay warm
        </span>

        <br><br>

        <div>
            Rain: {{ rain }}%
        </div>

        <input v-model.number="rain">

        <br><br>

        <img v-if="rain >= 60"
             src="image/umbrella.png"
             width="100">

        <img v-else-if="rain >= 30"
             src="image/rainy-1.png"
             width="100">

        <img v-else
             src="image/sunny.png"
             width="100">

    </div>

    <script src="https://unpkg.com/vue@3"></script>

    <script>
        const options = {
            data() {
                return {
                    temperature: 28,
                    rain: 10
                };
            }
        };

        Vue.createApp(options).mount("#app");
    </script>

</body>

</html>
