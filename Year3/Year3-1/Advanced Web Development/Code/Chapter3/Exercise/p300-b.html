<!DOCTYPE html>
<html>

<head>
  <title>First example</title>
</head>

<body>
  <div id="app">
    <p>This example adds two numbers.</p>
    <p>a: <input type="text" v-model.number="a"></p>
    <p>b: <input type="text" v-model.number="b"></p>
    <p><button type="button" @click="add">Calculate!</button></p>
    <p>a+b = <span id="ans">{{ ans }}</span></p>
  </div>

  <!-- loading the Vue v3 JavaScript library from CDN -->
  <script src="https://unpkg.com/vue@3"></script>
  <script>
    const options = {
      data() {
        return { a: null, b: null, ans: null }
      },
      methods: {
        add() {
          this.ans = this.a + this.b;
        }
      }
    };
    const vm = Vue.createApp(options).mount("#app");
  </script>
</body>

</html>
