<body>
    <script>
        // 2-3 Q2. Write a function `odd(n)` to generate an array
        // of odd numbers less than or equal to `n`. Test your 
        // function with the following code.

        // your work here
        function odd(n) {
            let result = [];
            for (let i = 1; i <= n; i += 2) {
                result.push(i);
            }
            return result;
        }
        let a = odd(1);
        console.log(a); // should print [1]
        console.log(odd(9)); // should print [1,3,5,7,9]

    </script>
</body>
