<body>
    <script>

        let classScores = [
            { code: "COMP111", marks: [32.7, 86.5, 77.2] },
            { code: "COMP112", marks: [65.5, 90.7, 65.5] },
            { code: "COMP113", marks: [99.8, 46.5, 87.6] },
        ];

        let score = classScores.map(cla => cla.marks);
        console.log(score);



        let all_score = [];
        for (let i = 0; i < score.length; i++) {
            for (let j = 0; j < score[i].length; j++) {
                all_score.push(score[i][j]);
            }
        }

        let max = all_score.reduce(function (a, b) {
            if (a > b) {
                return a;
            }
            else {
                return b;
            }
        }
        );
        console.log(`Max: ${max}`);
    </script>
