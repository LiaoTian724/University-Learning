    <script>
        // 2-2 Q1. Given an array `num`, write a JavaScript program 
        // to find the largest number in the array.

        let num = [32, 15, 20, 41, 2, 39];
        // your work here

        let maximum = num[0]
        for (let n of num) {
            if (n > maximum) {
                maximum = n;
            }
        }
        console.log(maximum);


    </script>
