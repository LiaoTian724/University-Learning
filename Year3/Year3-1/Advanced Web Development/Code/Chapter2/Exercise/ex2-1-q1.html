<html>
    <head>
        <title>Exercise 2.1 Question 1</title>
    </head>
    <body>
        <script>
            // 2-1 Q1. Write a program to calculate the sum of even 
            // positive numbers up to 30.
            // The answer should be 240.
            let num = 0;
            let answer = 0;
            while(num < 30){
                num += 2;
                answer += num;
            }
            
            console.log(`The answer is ${answer}`);
        </script>
    </body>
</html>
