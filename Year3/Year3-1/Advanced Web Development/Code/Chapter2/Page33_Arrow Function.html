<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Arrow Function Demo</title>
</head>

<body>


    <script>
        // arrow function
        let plusTwo = x => x + 2;

        // call the function
        let answer = plusTwo(5);
      
        // console output
        console.log(answer);
    </script>

</body>
</html>
