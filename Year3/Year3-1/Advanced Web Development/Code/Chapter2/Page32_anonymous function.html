<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Anonymous Function Demo</title>
</head>

<body>


    <script>
        // define an anonymous function and call it immediately
        let answer = (function(x, y) {
            return x + y;
        })(20, 33);

        // also show result in console
        console.log(answer);
    </script>

</body>
</html>
