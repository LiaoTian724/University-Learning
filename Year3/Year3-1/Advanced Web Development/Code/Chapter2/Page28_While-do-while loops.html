<!DOCTYPE html>
<html>

<body>

      <script>
            let i = 1;

            while (i <= 3) {
                  console.log(i);
                  i++;
            }


            let j = 1;
            do {
                  console.log(j);
                  j++;
            } while (j <= 3);


            let m = 10;

            while (m < 5) {
                  console.log("while执行了");
            }

            do {
                  console.log("do while执行了");
            } while (m < 5);
      </script>

</body>

</html>
