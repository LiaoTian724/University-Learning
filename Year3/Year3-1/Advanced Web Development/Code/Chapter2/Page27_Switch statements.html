<!DOCTYPE html>
<html lang="zh-CN">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Switch Statement Demo</title>
</head>

<body>

      <script>
            // switch 语句是 强等于 ===
            let x = "1";

            switch (x) {
                  case 1:
                        console.log("number");
                        break;

                  case "1":
                        console.log("string");
                        break;
            }
      </script>

</body>

</html>
