<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nested Data Structures</title>
</head>
<body>

<script>
    let students = [
        {
            name: "Tom",
            age: 20,
            scores: [80, 90, 95]
        },
        {
            name: "Amy",
            age: 21,
            scores: [88, 92, 100]
        }
    ];

    console.log(students[0].name);
    console.log(students[0].scores[2]);

    console.log(students[1].name);
    console.log(students[1].scores[0]);
</script>

</body>
</html>
